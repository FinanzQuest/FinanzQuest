services:
  db:
    container_name: postgres
    image: timescale/timescaledb:2.26.0-pg17
    environment:
      POSTGRES_USER: postgres
      PGDATA: /data/postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      SERVICE_WORKER_PASSWORD: ${SERVICE_WORKER_PASSWORD}
    volumes:
      - postgres:/data/postgres
      - ./dbinit/init.sh:/docker-entrypoint-initdb.d/00_init.sh
      - ./dbinit/00-preauth:/init/00-preauth
      # assets.csv must stay in the db container: seed/assets.sql runs
      # COPY ... FROM which reads the file SERVER-side (see apply_manifest.sh)
      - ./dbinit/assets.csv:/docker-entrypoint-initdb.d/data/assets.csv
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    container_name: auth_container
    image: supabase/auth:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_API_HOST: 0.0.0.0
      API_EXTERNAL_URL: ${SITE_URL}/auth/v1
      PORT: 9999
      DB_NAMESPACE: auth
      GOTRUE_LOG_LEVEL: debug
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgresql://auth_admin:${AUTH_ADMIN_PASSWORD}@db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # e-mail verification: off only for dev (MAILER_AUTOCONFIRM=true), see docs/email.md
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: FinanzQuest
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Bestätige deine E-Mail-Adresse für FinanzQuest
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Bestätige deine E-Mail-Adresse für FinanzQuest
      # templates are static files of the frontend (public/email), fetched by GoTrue
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://frontend:3000/email/confirmation.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://frontend:3000/email/email_change.html
      # GoTrue's default is low (30/h); every sign-up and resend counts
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${EMAILS_PER_HOUR:-300}
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_EXTERNAL_PHONE_ENABLED: false
      # guest mode: anonymous sign-ins, rate-limited per client IP that Caddy
      # sets on POST /signup only (see Caddyfile)
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: ${GUEST_SIGNUPS_PER_HOUR:-100}
      GOTRUE_RATE_LIMIT_HEADER: X-Signup-Client-Ip
      # email sign-ups run from the Next server action, so they share one
      # bucket (the frontend's IP) instead of one per student
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: ${SIGNUPS_PER_5MIN:-150}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - postgres

  rest:
    container_name: rest
    image: postgrest/postgrest:v13.0.4
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_POOL: 20
      PGRST_DB_SCHEMAS: "api,depots,users"
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ""
    restart: unless-stopped
    networks:
      - postgres

  gateway:
    container_name: gateway
    image: caddy:2-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # stores the SSL cert
      - caddy_config:/config
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    environment:
      CADDY_HOST: ${CADDY_HOST}
      FRONTEND_URL: ${FRONTEND_URL}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    networks:
      - postgres

  updater:
    container_name: updater
    build:
      context: ./updater
      dockerfile: ./dockerfile
      network: "host"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://service_worker:${SERVICE_WORKER_PASSWORD}@db:5432/postgres
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID}
      YF_TIMEOUT: 2
      ALPACA_TIMEOUT: 1000
      BATCH_SIZE: 10000
      FETCH_CHUNK_SIZE: 10
    restart: unless-stopped
    networks:
      - postgres

  db-init:
    image: postgres:17-alpine
    container_name: db-init
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      SERVICE_WORKER_PASSWORD: ${SERVICE_WORKER_PASSWORD}
      MANIFEST: /init/manifest.txt
      BASE: /init
    volumes:
      - ./dbinit:/init/dbinit
      - ./manifest.txt:/init/manifest.txt
    networks:
      - postgres
    command: >
      sh -c "
        echo 'Applying post-GoTrue schema from manifest.txt (skipping 00-preauth)...'
        sh /init/dbinit/apply_manifest.sh
        echo 'Post-auth initialization complete!'
      "

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  caddy_data:
  caddy_config:
